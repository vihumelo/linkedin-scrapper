[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-scrapper"
version = "0.1.0"
description = "REST API for LinkedIn job search"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.110,<1",
    "httpx[http2]>=0.27,<1",
    "lxml>=5,<7",
    "pydantic>=2.3,<3",
    "pydantic-settings>=2.2,<3",
    "starlette>=0.36.3,<2",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pyright[nodejs]>=1.1,<2",
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.5,<1",
    "deptry>=0.20",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM",
    "PLR0915", # Too many statements
    "C901",    # Cyclomatic complexity
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"

[tool.deptry]
known_first_party = ["app"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["lxml", "uvicorn"]
